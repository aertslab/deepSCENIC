[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deepscenic"
dynamic = ["version"]  # from git tags via hatch-vcs
description = "Deep learning for single-cell Gene Regulatory Networks"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
    {name = "Gabriele Partel", email = "gabriele.partel@kuleuven.be"}
]
maintainers = [
    {name = "Gabriele Partel", email = "gabriele.partel@kuleuven.be"},
    {name = "Lukas Mahieu", email = "lukas.mahieu@kuleuven.be"},
]
keywords = ["single-cell", "GRN", "deep-learning", "scverse", "multiomics", "gene-regulation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core scientific
    "numpy>=2.1",
    "pandas>=2.0,<3.0",  # Pin to 2.x until anndata fully supports pandas 3.0
    "scipy>=1.14",
    "scikit-learn>=1.2",

    # scverse ecosystem
    "anndata>=0.12",
    "mudata>=0.2.3",
    "scanpy>=1.11",

    # PyTorch ecosystem
    "torch>=2.6",
    "torch-geometric>=2.7",

    # Data fetching
    "pooch>=1.6",
    "pybiomart>=0.2",
    "requests>=2.28",
    "pyarrow>=14.0",  # For parquet caching

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",

    # Utilities
    "tqdm>=4.65",
    "networkx>=3.0",

    # Genome sequence handling
    "pyfaidx>=0.9",
]

[project.optional-dependencies]
enformer = [
    "enformer-pytorch>=0.8.12",  # pins a transformers version compatible with its PreTrainedModel subclass
]
dev = [
    "pre-commit>=3.0",
    "twine>=4.0",
    "ruff>=0.1.0",
]
doc = [
    "docutils>=0.8,!=0.18.*,!=0.19.*",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "myst-nb>=1.1",
    "pandas",
    "setuptools",  # for pybtex
    "sphinx>=8.1",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme>=1",
    "sphinx-copybutton",
    "sphinx-tabs",
    "sphinxcontrib-bibtex>=1",
    "sphinxext-opengraph",
    "enformer-pytorch>=0.8.12",  # pins a transformers version compatible with its PreTrainedModel subclass
]
test = [
    "enformer-pytorch>=0.8.12",  # pins a transformers version compatible with its PreTrainedModel subclass
    "pytest>=7.0",
    "debugpy",
]

[project.urls]
Homepage = "https://github.com/aertslab/deepSCENIC"
Documentation = "https://deepscenic.readthedocs.io"
Repository = "https://github.com/aertslab/deepSCENIC"
Issues = "https://github.com/aertslab/deepSCENIC/issues"

# Hatch build configuration
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscenic"]

# Hatch environments
[tool.hatch.envs.default]
installer = "uv"
features = ["dev", "test"]

# Run tests with `hatch test` (add --all for the full matrix); CI uses the same environment
[tool.hatch.envs.hatch-test]
features = ["test"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.envs.docs]
features = ["doc"]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -M html docs docs/_build {args}"
build-strict = "sphinx-build -M html docs docs/_build -W {args}"
open = "python -m webbrowser -t docs/_build/html/index.html"
clean = "rm -rf docs/_build docs/api/_autosummary"
linkcheck = "sphinx-build -b linkcheck docs docs/_build/linkcheck {args}"

# Ruff configuration
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
exclude = ["src/legacy", "main.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["deepscenic"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:From 0.4 .update:FutureWarning",
    "ignore::deepscenic._data.SchemaWarning",
    "ignore:'pin_memory' argument is set as true:UserWarning",
    "ignore:Cannot join columns with the same name:UserWarning",
]

[tool.hatch.envs.hatch-static-analysis]
config-path = "pyproject.toml"

# MyPy configuration
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false
warn_return_any = true
warn_unused_configs = true
