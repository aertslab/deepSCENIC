[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deepscenic"
version = "0.1.0"
description = "Deep learning for single-cell Gene Regulatory Networks"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [
    {name = "deepSCENIC Team"}
]
maintainers = [
    {name = "deepSCENIC Team"}
]
keywords = ["single-cell", "GRN", "deep-learning", "scverse", "multiomics", "gene-regulation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core scientific
    "numba >=0.61.2",
    "numpy>=1.23",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",

    # scverse ecosystem
    "anndata>=0.10",
    "mudata>=0.2.3",
    "scanpy>=1.9",

    # PyTorch ecosystem
    "torch>=2.0",
    "torch-geometric>=2.3",

    # Data fetching
    "pooch>=1.6",
    "pybiomart>=0.2",
    "requests>=2.28",
    "pyarrow>=14.0",  # For parquet caching

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",

    # Utilities
    "tqdm>=4.65",
    "h5py>=3.8",
    "networkx>=3.0",

    # Genome sequence handling
    "pyfaidx>=0.9",
    "tangermeme>=1.0.0",
]

[project.optional-dependencies]
enformer = ["enformer-pytorch>=0.8"]
sequence = [
    "logomaker>=0.8",
]
dev = [
    "pre-commit>=3.0",
    "twine>=4.0",
    "ruff>=0.1.0",
]
doc = [
    "docutils>=0.8,!=0.18.*,!=0.19.*",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "myst-nb>=1.1",
    "pandas",
    "setuptools",  # for pybtex
    "sphinx>=8.1",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme>=1",
    "sphinx-copybutton",
    "sphinx-tabs",
    "sphinxcontrib-bibtex>=1",
    "sphinxext-opengraph",
    "enformer-pytorch>=0.8",
]
test = [
    "enformer-pytorch>=0.8",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "debugpy",
]

[project.urls]
Homepage = "https://github.com/aertslab/deepSCENIC"
Documentation = "https://deepscenic.readthedocs.io"
Repository = "https://github.com/aertslab/deepSCENIC"
Issues = "https://github.com/aertslab/deepSCENIC/issues"

# Hatch build configuration
[tool.hatch.build.targets.wheel]
packages = ["src/deepscenic"]

# Hatch environments
[tool.hatch.envs.default]
installer = "uv"
features = ["dev", "test"]

[tool.hatch.envs.test]
features = ["test"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"
cov = "pytest --cov=src/deepscenic --cov-report=term-missing {args:tests}"

[[tool.hatch.envs.test.matrix]]
python = ["3.12"]

[tool.hatch.envs.docs]
features = ["doc"]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -M html docs docs/_build -W {args}"
open = "python -m webbrowser -t docs/_build/html/index.html"
clean = "rm -rf docs/_build docs/api/_autosummary"
linkcheck = "sphinx-build -b linkcheck docs docs/_build/linkcheck {args}"

# Ruff configuration
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]
exclude = ["src/legacy", "main.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["deepscenic"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:From 0.4 .update:FutureWarning",
    "ignore::deepscenic._data.SchemaWarning",
    "ignore:'pin_memory' argument is set as true:UserWarning",
    "ignore:Cannot join columns with the same name:UserWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/deepscenic"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.hatch.envs.hatch-static-analysis]
config-path = "pyproject.toml"

# MyPy configuration
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false
warn_return_any = true
warn_unused_configs = true
